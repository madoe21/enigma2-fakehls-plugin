name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Byte-compile plugin sources
        run: python -m compileall -q src

      - name: Shell syntax check
        run: |
          for f in $(git ls-files 'tests/*.sh' 'src/init.d/*' 'control/postinst' 'control/prerm'); do
            echo "sh -n $f"
            sh -n "$f"
          done

      - name: Unit tests
        # The 'test' target only exists once a branch ships tests.
        run: |
          if make -n test >/dev/null 2>&1; then
            make test
          else
            echo "::notice::no 'make test' target on this branch"
          fi

      - name: Build IPK
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext fakeroot binutils
          make ipk
          ls -l build/*.ipk

      - name: Check VERSION suffix matches branch
        # develop carries the rolling build counter, main never carries a suffix.
        # A main -> develop back-merge legitimately carries the clean release
        # version, so it is exempt from the develop rule.
        if: github.head_ref != 'main'
        run: |
          RAW=$(tr -d '[:space:]' < VERSION)
          BASE_REF="${{ github.base_ref || github.ref_name }}"
          HEAD_REF="${{ github.head_ref }}"
          echo "VERSION=$RAW base=$BASE_REF head=$HEAD_REF"
          case "$BASE_REF" in
            develop)
              case "$RAW" in
                *-build[0-9]*) : ;;
                *) echo "::error::VERSION '$RAW' on develop must look like X.Y.Z-buildN"; exit 1 ;;
              esac
              ;;
            main)
              case "$RAW" in
                *-*)
                  if [ "$HEAD_REF" = develop ] || case "$HEAD_REF" in hotfix/*) true ;; *) false ;; esac; then
                    echo "::warning::VERSION is still '$RAW' -- prepare-release strips the suffix on $HEAD_REF"
                  else
                    echo "::error::VERSION '$RAW' must be a clean X.Y.Z on main"; exit 1
                  fi
                  ;;
              esac
              ;;
          esac
